name: Reliability Soak

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: soak
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:soak
        env:
          SOAK_SECONDS: '120'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
