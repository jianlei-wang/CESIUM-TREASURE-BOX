name = "cesium-views"
main = "worker/index.mjs"
compatibility_date = "2026-01-01"

# Cloudflare 免费额度：Workers 10 万请求/天，D1 500 万行读/天、10 万行写/天。
# 部署前先执行：
#   npx wrangler d1 create cesium-views
# 把返回的 database_id 填到下面。

[[d1_databases]]
binding = "DB"
database_name = "cesium-views"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# 允许跨域访问的前端来源，多个用英文逗号分隔；留空则允许任意来源。
CORS_ORIGINS = "https://jianlei-wang.github.io"
# 案例目录来源（GitHub Pages 上的 scripts/gen-case-catalog.mjs 产物）。
CATALOG_URL = "https://jianlei-wang.github.io/CESIUM-TREASURE-BOX/data/cases.json"

# 后台口令请用 secret 写入，不要写在这里：
#   npx wrangler secret put ADMIN_TOKEN

[observability]
enabled = true
